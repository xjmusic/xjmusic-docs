name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

# The run proves itself to AWS with GitHub's OIDC token: this public repository
# cannot read the org's AWS keys, which reach private repositories only.
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-22.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          # Pinned: the vendored Relearn theme (6.0.0) reads .Site.Sites.First,
          # which later Hugo removed, so 'latest' no longer builds the site.
          # 0.127.0 is the version the live site was built with.
          hugo-version: '0.127.0'
          extended: true

      - name: Build
        run: hugo --minify

      - name: Configure AWS Credentials
        # outrightmental/infra projects/xj/github-deploy-docs-xjmusic-com.tf: a role only
        # main of this repository can assume, which writes the docs bucket and invalidates
        # its distribution, and nothing else.
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Publish to AWS S3
        run: aws s3 cp --recursive ./public/ s3://docs.xjmusic.com/

      - name: Invalidate AWS CloudFront distribution
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
